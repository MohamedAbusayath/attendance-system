<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<button id="menu-toggle" aria-label="Toggle menu">☰</button>
<div class="container">

<!-- Sidebar -->
<div class="sidebar">

<h2>Attendance</h2>

<ul>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="sites.html">Sites</a></li>
<li><a href="teams.html">Teams</a></li>
<li><a href="employees.html">Employees</a></li>
<li><a href="attendance.html">Attendance</a></li>
</ul>

</div>

<!-- Main Content -->
<div class="main">

<h1>Employees</h1>

<h3>Add Employee</h3>

<input type="text" id="empName" placeholder="Name">
<input type="text" id="empPhone" placeholder="Phone">
<input type="text" id="empRole" placeholder="Role">

<select id="teamSelect"></select>

<button onclick="addEmployee()">Add Employee</button>

<h3>All Employees</h3>

<table border="1" width="100%">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Role</th>
<th>Team</th>
<th>Action</th>
</tr>
</thead>

<tbody id="employeeTable"></tbody>

</table>

</div>

</div>

<script>
(function(){
    const btn = document.getElementById('menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    if(btn && sidebar){
        btn.addEventListener('click', ()=> sidebar.classList.toggle('open'));
        sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=> sidebar.classList.remove('open')));
    }
})();
</script>
<script src="js/employees.js"></script>

</body>
</html>
